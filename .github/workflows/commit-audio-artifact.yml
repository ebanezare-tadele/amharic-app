name: Commit audio artifact (one-time)

# One-off helper: pulls the amharic-audio artifact from a previous
# generate-audio.yml run (which already contains the verified clips +
# manifest.json) and commits it into public/audio/official. Exists
# because the artifact lives on Azure Blob storage, which some sandboxed
# tooling environments can't reach directly — but a GitHub Actions
# runner always can. Safe to delete once no longer needed.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID to pull the amharic-audio artifact from"
        type: string
        required: true

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: amharic-audio
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: scripts/official-audio-out
      - name: Commit verified clips into public/audio/official
        run: |
          set -e
          if [ ! -f scripts/official-audio-out/manifest.json ]; then
            echo "No manifest.json in artifact — nothing to commit."
            exit 1
          fi
          mkdir -p public/audio/official
          rm -f public/audio/official/*.mp3
          cp scripts/official-audio-out/*.mp3 public/audio/official/
          cp scripts/official-audio-out/manifest.json public/audio/official/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio/official
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('scripts/official-audio-out/manifest.json')).length)")
          git commit -m "Add official audio clips ($COUNT verified)"
          git push
