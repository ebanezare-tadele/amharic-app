name: Generate official audio (one-time)

# Manually triggered from the Actions tab — this is not part of the normal
# deploy pipeline. It calls the Addis AI Voice 2 API to render every
# letter row/word/phrase in the app to a real Amharic mp3, verifies each
# one with ffprobe/ffmpeg (duration + inter-syllable silence gaps — see
# the long comment atop scripts/generate-official-audio.mjs for why it's
# built this way, not a speech-recognition model), and hands the result
# back as a downloadable build artifact (not committed to the repo) along
# with a manifest.json of what actually passed.
#
# Requires a repo secret named ADDIS_API_KEY (Settings -> Secrets and
# variables -> Actions -> New repository secret) holding the Addis AI key.
on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Run only 3 jobs (1 letter row, 1 anchor word, 1 phrase) to sanity-check the pipeline before committing to the full ~82-job batch"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Confirmed the hard way: this runner image does NOT reliably put
      # ffprobe on PATH even where ffmpeg itself might be -- a real run
      # failed every single job with "spawn ffprobe ENOENT" before ever
      # reaching a duration check. Install both explicitly instead of
      # trusting what's preinstalled; apt already has current packages
      # cached on this image so this is fast.
      - name: Install ffmpeg (provides both ffmpeg and ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate + verify audio clips
        id: generate
        env:
          ADDIS_API_KEY: ${{ secrets.ADDIS_API_KEY }}
          SMOKE_TEST: ${{ inputs.smoke_test && '1' || '' }}
        # The script exits 1 whenever ANY job never verifies, even though a
        # partial batch (e.g. 278/286 clips) is still a good result worth
        # shipping — the app already falls back gracefully per-clip via
        # manifest.json. continue-on-error so the commit step below still
        # runs and ships whatever did verify; the job's own final exit
        # code (set from this step's outcome, further down) still reflects
        # whether anything failed, so a genuinely broken run still shows
        # red in the Actions tab.
        continue-on-error: true
        run: node scripts/generate-official-audio.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Uploading the raw mp3 folder (not the script's own zip) so the
          # artifact download — which GitHub always wraps in a zip of its
          # own — doesn't end up double-zipped. if: always() so a partial
          # or failed run's manifest.json and log are still retrievable.
          name: amharic-audio
          path: scripts/official-audio-out
          retention-days: 14
      # Commit whatever verified clips exist straight from the runner --
      # this runner has its own unrestricted network and push access via
      # GITHUB_TOKEN, so there's no need to round-trip a multi-MB zip
      # through anything else. Runs even on partial failure (see above);
      # only skips if the script produced no manifest at all (e.g. it
      # crashed before writing anything).
      - name: Commit verified clips into public/audio/official
        if: always()
        run: |
          set -e
          if [ ! -f scripts/official-audio-out/manifest.json ]; then
            echo "No manifest.json produced — nothing to commit."
            exit 0
          fi
          mkdir -p public/audio/official
          rm -f public/audio/official/*.mp3
          cp scripts/official-audio-out/*.mp3 public/audio/official/
          cp scripts/official-audio-out/manifest.json public/audio/official/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio/official
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('scripts/official-audio-out/manifest.json')).length)")
          git commit -m "Add official audio clips ($COUNT verified)"
          git push
      - name: Fail the job if any clip never verified
        if: steps.generate.outcome == 'failure'
        run: exit 1
