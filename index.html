<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10162A" />
    <meta name="description" content="Learn the Amharic fidel — 34 consonant families across 7 vowel orders." />

    <!-- Preview card shown when this link is shared (iMessage, WhatsApp,
         Slack, etc). og:image/og:url need absolute URLs per spec, so
         these are hardcoded to the deployed GitHub Pages URL rather than
         using %BASE_URL% — update if the app ever moves to a different
         URL (see also BASE in vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ፊደል — Amharic Fidel" />
    <meta property="og:description" content="Learn the Amharic script — 34 letters, 7 vowels each, at your own pace." />
    <meta property="og:url" content="https://ebanezare-tadele.github.io/amharic-app/" />
    <meta property="og:image" content="https://ebanezare-tadele.github.io/amharic-app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ፊደል — Amharic Fidel" />
    <meta name="twitter:description" content="Learn the Amharic script — 34 letters, 7 vowels each, at your own pace." />
    <meta name="twitter:image" content="https://ebanezare-tadele.github.io/amharic-app/og-image.png" />

    <!-- Android Chrome reads the Web App Manifest (injected by
         vite-plugin-pwa) for install/standalone behavior. iOS Safari
         mostly ignores it and needs its own meta tags below instead. -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS: "Add to Home Screen" only produces a standalone (no browser
         chrome) app, a real title, and the right icon if these are set —
         the manifest above isn't enough on its own. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent": translucent draws app content
         edge-to-edge under the status bar/notch, which needs
         env(safe-area-inset-top) padding App.jsx's CSS doesn't reserve
         (it only pads the bottom, for the tab bar). Plain "black" keeps
         the status bar as its own reserved strip instead — and since the
         app's background is already near-black (#10162A), it reads as
         seamless without touching App.jsx's CSS at all. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ፊደል" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />

    <title>ፊደል — Amharic Fidel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
